name: default
provider: openai
model: gpt-5
temperature: 0.2
max_context_tokens: 120000

capabilities:
  tool_use: true
  json_mode: true
  structured_outputs: true
  long_context: true
  vision: true
  embeddings: true

policies:
  require_trace: true
  require_citations: true
  allow_file_read: true
  allow_file_write: true
  require_human_review_for_deletion: true

notes:
  - Use this profile as the high-quality default for complex synthesis and writing.

